<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Blast Mini</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
body {
  background: #080b12;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  touch-action: none;
}
.bb-wrap {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.bb-card {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0, 243, 255, 0.25);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 243, 255, 0.1);
}
.bb-header {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0, 0, 0, 0.2);
}
.bb-sub {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #00f3ff;
  font-weight: 800;
  text-transform: uppercase;
}
.bb-title {
  font-size: 17px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.5px;
}
.bb-stats {
  display: flex;
  align-items: center;
  gap: 12px;
}
.bb-score {
  font-size: 19px;
  font-weight: 900;
  color: #00f3ff;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.bb-best {
  font-size: 9px;
  color: rgba(255, 255, 255, 0.5);
  font-weight: 700;
  text-align: right;
}
.bb-body {
  flex: 1;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 6px;
}
canvas#game {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
</style>
</head>
<body>

<div class="bb-wrap">
  <div class="bb-card">
    <div class="bb-header">
      <div>
        <div class="bb-sub">SIX CORE</div>
        <div class="bb-title">Block Blast</div>
      </div>
      <div class="bb-stats">
        <div>
          <div id="score" class="bb-score">0</div>
          <div id="best" class="bb-best">BEST 0</div>
        </div>
      </div>
    </div>
    <div class="bb-body">
      <canvas id="game" width="480" height="640"></canvas>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const GRID_SIZE = 8;
  const CELL_SIZE = 48;
  const CELL_GAP = 4;
  const BOARD_PX = (GRID_SIZE * CELL_SIZE) + ((GRID_SIZE - 1) * CELL_GAP);
  const BOARD_X = (canvas.width - BOARD_PX) / 2;
  const BOARD_Y = 24;

  const TRAY_Y = 530;
  const TRAY_SLOTS = [
    { x: 80, y: TRAY_Y },
    { x: 240, y: TRAY_Y },
    { x: 400, y: TRAY_Y }
  ];

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, type, duration, ramp) {
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (ramp) osc.frequency.exponentialRampToValueAtTime(ramp, now + duration);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch(e){}
  }

  const PIECES = [
    { shape: [[1]], color: '#00f3ff' },
    { shape: [[1, 1]], color: '#38bdf8' },
    { shape: [[1], [1]], color: '#38bdf8' },
    { shape: [[1, 1, 1]], color: '#818cf8' },
    { shape: [[1], [1], [1]], color: '#818cf8' },
    { shape: [[1, 1, 1, 1]], color: '#c084fc' },
    { shape: [[1], [1], [1], [1]], color: '#c084fc' },
    { shape: [[1, 1], [1, 1]], color: '#facc15' },
    { shape: [[1, 0], [1, 1]], color: '#4ade80' },
    { shape: [[0, 1], [1, 1]], color: '#4ade80' },
    { shape: [[1, 1], [1, 0]], color: '#4ade80' },
    { shape: [[1, 1], [0, 1]], color: '#4ade80' },
    { shape: [[1, 0, 0], [1, 1, 1]], color: '#fb923c' },
    { shape: [[0, 0, 1], [1, 1, 1]], color: '#fb923c' },
    { shape: [[1, 1, 1], [0, 1, 0]], color: '#f472b6' }
  ];

  let grid = [];
  let tray = [null, null, null];
  let score = 0, bestScore = 0;
  let draggedIdx = -1;
  let dragX = 0, dragY = 0;
  let isDragging = false;
  let shake = 0;
  let particles = [];
  let floatingTexts = [];
  let clearingEffects = [];
  let gameOver = false;

  try {
    bestScore = parseInt(localStorage.getItem('bb_mini_best') || '0', 10);
  } catch(e){}

  function resetGame() {
    grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
    tray = [null, null, null];
    score = 0;
    particles = [];
    floatingTexts = [];
    clearingEffects = [];
    shake = 0;
    gameOver = false;
    spawnTray();
    updateUI();
  }

  function spawnTray() {
    for (let i = 0; i < 3; i++) {
      if (tray[i] === null) {
        const p = PIECES[Math.floor(Math.random() * PIECES.length)];
        tray[i] = {
          shape: JSON.parse(JSON.stringify(p.shape)),
          color: p.color
        };
      }
    }
  }

  function updateUI() {
    scoreEl.textContent = score;
    bestEl.textContent = 'BEST ' + bestScore;
  }

  function canPlace(piece, r, c) {
    if (!piece) return false;
    const h = piece.shape.length;
    const w = piece.shape[0].length;
    for (let row = 0; row < h; row++) {
      for (let col = 0; col < w; col++) {
        if (piece.shape[row][col] === 1) {
          const gr = r + row;
          const gc = c + col;
          if (gr < 0 || gr >= GRID_SIZE || gc < 0 || gc >= GRID_SIZE) return false;
          if (grid[gr][gc] !== null) return false;
        }
      }
    }
    return true;
  }

  function checkCanMove() {
    for (let i = 0; i < 3; i++) {
      const piece = tray[i];
      if (piece) {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (canPlace(piece, r, c)) return true;
          }
        }
      }
    }
    return false;
  }

  function addBurst(x, y, color) {
    for (let i = 0; i < 6; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        color: color
      });
    }
  }

  function placeCurrentPiece(index, targetRow, targetCol) {
    const piece = tray[index];
    const h = piece.shape.length;
    const w = piece.shape[0].length;
    let placedCount = 0;

    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        if (piece.shape[r][c] === 1) {
          grid[targetRow + r][targetCol + c] = piece.color;
          placedCount++;
          const cx = BOARD_X + (targetCol + c) * (CELL_SIZE + CELL_GAP) + CELL_SIZE / 2;
          const cy = BOARD_Y + (targetRow + r) * (CELL_SIZE + CELL_GAP) + CELL_SIZE / 2;
          addBurst(cx, cy, piece.color);
        }
      }
    }

    playTone(480, 'sine', 0.08, 620);
    score += placedCount * 10;
    tray[index] = null;

    let fullRows = [];
    let fullCols = [];

    for (let r = 0; r < GRID_SIZE; r++) {
      if (grid[r].every(v => v !== null)) fullRows.push(r);
    }

    for (let c = 0; c < GRID_SIZE; c++) {
      let isColFull = true;
      for (let r = 0; r < GRID_SIZE; r++) {
        if (grid[r][c] === null) { isColFull = false; break; }
      }
      if (isColFull) fullCols.push(c);
    }

    const lines = fullRows.length + fullCols.length;
    if (lines > 0) {
      shake = 8;
      playTone(600, 'triangle', 0.2, 950);

      fullRows.forEach(r => {
        for (let c = 0; c < GRID_SIZE; c++) {
          clearingEffects.push({ r, c, alpha: 1.0, color: grid[r][c] });
          grid[r][c] = null;
        }
      });

      fullCols.forEach(c => {
        for (let r = 0; r < GRID_SIZE; r++) {
          clearingEffects.push({ r, c, alpha: 1.0, color: grid[r][c] });
          grid[r][c] = null;
        }
      });

      const bonus = lines * 150;
      score += bonus;
      floatingTexts.push({
        text: '+' + bonus,
        x: BOARD_X + BOARD_PX / 2,
        y: BOARD_Y + BOARD_PX / 2,
        life: 1.0
      });
    }

    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('bb_mini_best', String(bestScore)); } catch(e){}
    }

    updateUI();

    if (tray.every(t => t === null)) {
      spawnTray();
    }

    if (!checkCanMove()) {
      gameOver = true;
      playTone(220, 'sawtooth', 0.35, 80);
    }
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const touch = e.touches ? e.touches[0] : e;
    return {
      x: (touch.clientX - rect.left) * scaleX,
      y: (touch.clientY - rect.top) * scaleY
    };
  }

  function drawPiece(piece, startX, startY, scale, isGhost, valid) {
    const h = piece.shape.length;
    const w = piece.shape[0].length;
    const size = CELL_SIZE * scale;
    const gap = CELL_GAP * scale;

    ctx.save();
    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        if (piece.shape[r][c] === 1) {
          const x = startX + c * (size + gap);
          const y = startY + r * (size + gap);
          if (isGhost) {
            ctx.fillStyle = valid ? 'rgba(0, 243, 255, 0.4)' : 'rgba(239, 68, 68, 0.4)';
            ctx.strokeStyle = valid ? '#00f3ff' : '#ef4444';
            ctx.lineWidth = 2;
            ctx.fillRect(x, y, size, size);
            ctx.strokeRect(x, y, size, size);
          } else {
            ctx.fillStyle = piece.color;
            ctx.shadowColor = piece.color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, size, size, 4);
            else ctx.rect(x, y, size, size);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fillRect(x + 2, y + 2, size - 4, (size - 4) * 0.3);
          }
        }
      }
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
      if (shake < 0.2) shake = 0;
    }

    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(BOARD_X - 8, BOARD_Y - 8, BOARD_PX + 16, BOARD_PX + 16, 12);
    else ctx.rect(BOARD_X - 8, BOARD_Y - 8, BOARD_PX + 16, BOARD_PX + 16);
    ctx.fill();

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const x = BOARD_X + c * (CELL_SIZE + CELL_GAP);
        const y = BOARD_Y + r * (CELL_SIZE + CELL_GAP);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, CELL_SIZE, CELL_SIZE, 6);
        else ctx.rect(x, y, CELL_SIZE, CELL_SIZE);
        ctx.fill();

        if (grid[r][c] !== null) {
          ctx.save();
          ctx.fillStyle = grid[r][c];
          ctx.shadowColor = grid[r][c];
          ctx.shadowBlur = 8;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, y, CELL_SIZE, CELL_SIZE, 6);
          else ctx.rect(x, y, CELL_SIZE, CELL_SIZE);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.fillRect(x + 3, y + 3, CELL_SIZE - 6, (CELL_SIZE - 6) * 0.3);
          ctx.restore();
        }
      }
    }

    clearingEffects.forEach(effect => {
      const x = BOARD_X + effect.c * (CELL_SIZE + CELL_GAP);
      const y = BOARD_Y + effect.r * (CELL_SIZE + CELL_GAP);
      ctx.save();
      ctx.globalAlpha = effect.alpha;
      ctx.fillStyle = '#fff';
      ctx.shadowColor = effect.color;
      ctx.shadowBlur = 12;
      ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
      ctx.restore();
      effect.alpha -= 0.08;
    });
    clearingEffects = clearingEffects.filter(e => e.alpha > 0);

    if (isDragging && draggedIdx !== -1 && tray[draggedIdx]) {
      const piece = tray[draggedIdx];
      const pw = piece.shape[0].length;
      const ph = piece.shape.length;
      const piecePxW = pw * CELL_SIZE + (pw - 1) * CELL_GAP;
      const piecePxH = ph * CELL_SIZE + (ph - 1) * CELL_GAP;

      const targetX = dragX - piecePxW / 2;
      const targetY = dragY - 80 - piecePxH / 2;

      const col = Math.round((targetX - BOARD_X) / (CELL_SIZE + CELL_GAP));
      const row = Math.round((targetY - BOARD_Y) / (CELL_SIZE + CELL_GAP));

      const valid = canPlace(piece, row, col);
      if (col >= 0 && col < GRID_SIZE && row >= 0 && row < GRID_SIZE) {
        const snapX = BOARD_X + col * (CELL_SIZE + CELL_GAP);
        const snapY = BOARD_Y + row * (CELL_SIZE + CELL_GAP);
        drawPiece(piece, snapX, snapY, 1.0, true, valid);
      }

      drawPiece(piece, targetX, targetY, 1.0, false, true);
    }

    ctx.fillStyle = 'rgba(15, 23, 42, 0.5)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(BOARD_X - 8, TRAY_Y - 45, BOARD_PX + 16, 120, 14);
    else ctx.rect(BOARD_X - 8, TRAY_Y - 45, BOARD_PX + 16, 120);
    ctx.fill();

    for (let i = 0; i < 3; i++) {
      if (tray[i] && i !== draggedIdx) {
        const piece = tray[i];
        const scale = 0.55;
        const pw = (piece.shape[0].length * CELL_SIZE + (piece.shape[0].length - 1) * CELL_GAP) * scale;
        const ph = (piece.shape.length * CELL_SIZE + (piece.shape.length - 1) * CELL_GAP) * scale;
        drawPiece(piece, TRAY_SLOTS[i].x - pw / 2, TRAY_SLOTS[i].y - ph / 2, scale, false, true);
      }
    }

    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
      ctx.restore();
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
    });
    particles = particles.filter(p => p.life > 0);

    floatingTexts.forEach(t => {
      ctx.save();
      ctx.globalAlpha = t.life;
      ctx.fillStyle = '#00f3ff';
      ctx.font = '900 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
      t.y -= 1.2;
      t.life -= 0.03;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);

    ctx.restore();

    if (gameOver) {
      ctx.fillStyle = 'rgba(6, 9, 17, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ef4444';
      ctx.font = '900 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

      ctx.fillStyle = '#00f3ff';
      ctx.font = '700 16px sans-serif';
      ctx.fillText('Tap untuk bermain lagi', canvas.width / 2, canvas.height / 2 + 25);
    }

    requestAnimationFrame(render);
  }

  function handleStart(e) {
    initAudio();
    if (gameOver) {
      resetGame();
      return;
    }
    const pos = getCanvasCoords(e);
    for (let i = 0; i < 3; i++) {
      if (tray[i]) {
        const dx = Math.abs(pos.x - TRAY_SLOTS[i].x);
        const dy = Math.abs(pos.y - TRAY_SLOTS[i].y);
        if (dx < 50 && dy < 50) {
          isDragging = true;
          draggedIdx = i;
          dragX = pos.x;
          dragY = pos.y;
          break;
        }
      }
    }
  }

  function handleMove(e) {
    if (!isDragging) return;
    const pos = getCanvasCoords(e);
    dragX = pos.x;
    dragY = pos.y;
  }

  function handleEnd() {
    if (!isDragging) return;
    if (draggedIdx !== -1 && tray[draggedIdx]) {
      const piece = tray[draggedIdx];
      const pw = piece.shape[0].length;
      const ph = piece.shape.length;
      const piecePxW = pw * CELL_SIZE + (pw - 1) * CELL_GAP;
      const piecePxH = ph * CELL_SIZE + (ph - 1) * CELL_GAP;

      const targetX = dragX - piecePxW / 2;
      const targetY = dragY - 80 - piecePxH / 2;

      const col = Math.round((targetX - BOARD_X) / (CELL_SIZE + CELL_GAP));
      const row = Math.round((targetY - BOARD_Y) / (CELL_SIZE + CELL_GAP));

      if (canPlace(piece, row, col)) {
        placeCurrentPiece(draggedIdx, row, col);
      }
    }
    isDragging = false;
    draggedIdx = -1;
  }

  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e); }, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); handleEnd(); }, { passive: false });

  canvas.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);

  resetGame();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
