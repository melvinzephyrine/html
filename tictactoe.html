<style>
:root{
  --ink:#e9edef;
  --ink-soft:#aebac1;
  --muted:#8696a0;
  --accent:#00a884;
  --line:#2a3942;
  --line-strong:#374248;
  --cell-bg:#111b21;
  --o:#00a884;
  --x:#e9edef;
  --card-2:#2a3942;
  --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  background:transparent;
  color:var(--ink);
  font-family:var(--sys);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.stage{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}
.card{ width:100%; max-width:360px; }
.header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
  gap:8px;
}
.header__title{ font-size:17px; font-weight:600; color:var(--ink); }
.header__sub{ font-size:12px; color:var(--muted); }
.mode-title, .levels__label{ font-size:11px; color:var(--muted); margin-bottom:8px; }
.mode{ display:flex; gap:8px; margin-bottom:14px; }
.mode button{
  flex:1;
  background:transparent;
  border:1px solid var(--line-strong);
  border-radius:20px;
  padding:10px 8px;
  font-size:12px;
  font-weight:500;
  color:var(--ink-soft);
  cursor:pointer;
  font-family:inherit;
}
.mode button.is-active{
  background:var(--accent);
  border-color:var(--accent);
  color:#0b141a;
}
.status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  font-size:13px;
  gap:8px;
}
.status__turn{ display:flex; align-items:center; gap:8px; color:var(--ink-soft); }
.status__indicator{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--x);
  flex-shrink:0;
}
.status__indicator.is-o{ background:var(--o); }
.status__indicator.is-thinking{ position:relative; }
.status__indicator.is-thinking::after{
  content:'';
  position:absolute;
  inset:-3px;
  border-radius:50%;
  border:1.5px solid var(--o);
  animation:ring 1.1s ease-out infinite;
}
@keyframes ring{
  0%{ transform:scale(.7); opacity:1; }
  100%{ transform:scale(2.2); opacity:0; }
}
.status__score{ display:flex; gap:10px; color:var(--muted); font-size:11px; }
.status__score b{ color:var(--ink); margin-left:3px; }
.board{
  width:100%;
  aspect-ratio:1;
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  background:var(--cell-bg);
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
}
.cell{
  position:relative;
  background:transparent;
  border:none;
  cursor:pointer;
  padding:0;
  color:inherit;
}
.cell:disabled{ cursor:default; }
.cell:focus-visible{ outline:2px solid var(--accent); outline-offset:-3px; }
.cell::before{
  content:'';
  position:absolute;
  right:0;
  top:6%;
  bottom:6%;
  width:1px;
  background:var(--line-strong);
}
.cell:nth-child(3n)::before{ display:none; }
.cell::after{
  content:'';
  position:absolute;
  bottom:0;
  left:6%;
  right:6%;
  height:1px;
  background:var(--line-strong);
}
.cell:nth-last-child(-n+3)::after{ display:none; }
.cell.is-winning{ background:rgba(0,168,132,.14); }
.cell.is-winning-x{ background:rgba(233,237,239,.07); }
.mark{ position:absolute; inset:22%; pointer-events:none; }
.mark__svg{ width:100%; height:100%; overflow:visible; }
.mark__svg path, .mark__svg circle{
  fill:none;
  stroke:var(--x);
  stroke-width:9;
  stroke-linecap:round;
}
.mark--o .mark__svg path, .mark--o .mark__svg circle{ stroke:var(--o); }
.mark__svg path{
  stroke-dasharray:120;
  stroke-dashoffset:120;
  animation:draw .3s ease-out forwards;
}
.mark__svg path:nth-child(2){ animation-delay:.12s; }
.mark__svg circle{
  stroke-dasharray:220;
  stroke-dashoffset:220;
  animation:draw .4s ease-out forwards;
}
@keyframes draw{ to{ stroke-dashoffset:0; } }
.winning-line{
  position:absolute;
  height:4px;
  background:var(--o);
  transform-origin:left center;
  z-index:5;
  pointer-events:none;
  border-radius:2px;
}
.winning-line.is-x{ background:var(--x); }
.levels{ margin-top:14px; }
.levels__list{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:2px 2px 6px;
}
.levels__list::-webkit-scrollbar{ display:none; }
.level{
  background:transparent;
  border:1px solid var(--line-strong);
  border-radius:20px;
  padding:10px 18px;
  font-size:13px;
  color:var(--ink-soft);
  cursor:pointer;
  font-family:inherit;
  white-space:nowrap;
  flex-shrink:0;
}
.level.is-active{
  background:var(--accent);
  border-color:var(--accent);
  color:#0b141a;
}
.footer{ margin-top:12px; display:flex; justify-content:center; }
.footer__reset{
  background:none;
  border:none;
  color:var(--accent);
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  padding:8px 16px;
}
.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}
.modal.is-open{ opacity:1; pointer-events:auto; }
.modal__backdrop{ position:absolute; inset:0; background:transparent; }
.modal__card{
  position:relative;
  background:var(--card-2);
  border-radius:12px;
  padding:24px 24px 0;
  text-align:center;
  max-width:320px;
  width:100%;
  box-shadow:0 24px 50px -12px rgba(0,0,0,.6);
  transform:translateY(8px) scale(.96);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
.modal.is-open .modal__card{ transform:translateY(0) scale(1); }
.modal__title{ font-size:20px; font-weight:700; color:var(--ink); margin-bottom:8px; }
.modal__title.is-o{ color:var(--o); }
.modal__sub{ font-size:14px; color:var(--muted); margin-bottom:20px; }
.modal__retry{
  background:transparent;
  border:none;
  color:var(--accent);
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  padding:14px 24px;
  width:100%;
  border-top:1px solid var(--line-strong);
}
@media(max-width:380px){
  .stage{ padding:16px 12px; }
  .level{ padding:9px 16px; font-size:12px; }
}
</style>

<main class="stage">
  <div class="card">
    <div class="header">
      <div class="header__title">Tic-Tac-Toe</div>
      <div class="header__sub">X vs O</div>
    </div>
    <div class="mode-title">Mode permainan</div>
    <div class="mode">
      <button id="modeAI" class="is-active">🤖 Lawan AI</button>
      <button id="modePvP">👥 2 Player</button>
    </div>
    <div class="status">
      <div class="status__turn">
        <span class="status__indicator" id="indicator"></span>
        <span id="status-text">Giliranmu</span>
      </div>
      <div class="status__score">
        <span>X<b id="score-x">0</b></span>
        <span>Seri<b id="score-d">0</b></span>
        <span>O<b id="score-o">0</b></span>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="levels" id="levels">
      <div class="levels__label">Tingkat lawan</div>
      <div class="levels__list" id="levels-list"></div>
    </div>
    <div class="footer">
      <button class="footer__reset" id="reset">Ulang papan</button>
    </div>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" id="modal-backdrop"></div>
  <div class="modal__card">
    <h2 class="modal__title" id="modal-title">Kamu menang</h2>
    <p class="modal__sub" id="modal-sub">Bagus sekali. Mau coba lagi?</p>
    <button class="modal__retry" id="modal-retry">Coba lagi</button>
  </div>
</div>

<script>

  over: false,

  line: null,
  thinking: false,
  level: 2,
  scores: { X:0, O:0, D:0 }
};

const LEVELS = [
  {name:'Pemula'},
  {name:'Terlatih'},
  {name:'Taktisi'},
  {name:'Master'}

const WIN_LINES = [

  [0,3,6], [1,4,7], [2,5,8],
  [0,4,8], [2,4,6]
];

const $ = id => document.getElementById(id);

function buildBoard(){
  boardEl.innerHTML = '';
  for(let i=0; i<9; i++){
    const c = document.createElement('button');
    c.className = 'cell';
    c.dataset.idx = i;

    boardEl.appendChild(c);
  }
}

function buildLevels(){
  levelsList.innerHTML = '';
  LEVELS.forEach((lvl,i)=>{
    const b = document.createElement('button');
    b.className = 'level' + (i === state.level ? ' is-active' : '');
    b.textContent = lvl.name;
    b.addEventListener('click', ()=>setLevel(i));
    levelsList.appendChild(b);
  });
}

function setLevel(i){
  state.level = i;
  document.querySelectorAll('.level').forEach((el,idx)=>{
    el.classList.toggle('is-active', idx === i);
  });
  resetBoard();
}

function setMode(mode){
  state.mode = mode;
  $('modeAI').classList.toggle('is-active', mode === 'ai');
  $('modePvP').classList.toggle('is-active', mode === 'pvp');
  levelsEl.style.display = mode === 'ai' ? '' : 'none';
  resetBoard();
}

        <path d="M 78 22 L 22 78"/>
      </svg>
